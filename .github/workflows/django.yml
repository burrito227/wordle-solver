name: Wordle-Solver CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build and deploy
      run: |
        sudo docker compose down
        sudo docker compose up --build -d
